<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="gueBg" x1="6" y1="60" x2="58" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="55%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="gueGlow" cx="0.82" cy="0.16" r="0.62">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="gueClip">
      <rect x="2" y="2" width="60" height="60" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#gueClip)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gueBg)"/>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gueGlow)"/>
  </g>

  <!-- Crisp border separating badge on light, slate-navy, and blue navbars -->
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="rgba(255,255,255,0.34)" stroke-width="1.5"/>

  <!-- Subtle full track ring -->
  <circle cx="32" cy="33" r="16.5" stroke="rgba(255,255,255,0.18)" stroke-width="5"/>

  <!-- 75% Attendance Progress Arc (clockwise 270 deg from 3 o'clock to 12 o'clock) -->
  <path d="M 48.5 33 A 16.5 16.5 0 1 1 32 16.5" stroke="#ffffff" stroke-width="5.2" stroke-linecap="round"/>

  <!-- Sharp unobstructed checkmark rising through the open quadrant -->
  <path d="M 24 33.5 L 30.5 40 L 48 20.5" stroke="#ffffff" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 75% Threshold Marker Dot at 12 o'clock -->
  <circle cx="32" cy="16.5" r="3.6" fill="#34d399" stroke="#ffffff" stroke-width="1.4"/>
</svg>
