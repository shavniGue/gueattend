<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gueattend | Password Assistance</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
</head>
<body class="login-wrapper">

  <div class="login-card">
    <div class="login-header">
      <a href="/" class="auth-brand-row">
        <span class="auth-brand-icon">
          <img src="/images/logo.svg" alt="gueattend logo" class="brand-logo-img" width="28" height="28">
        </span>
        <span class="auth-brand-name">gueattend</span>
      </a>
      <div class="auth-tagline">TRACK. ALERT. STAY UPDATED.</div>
      <h1>Password Recovery</h1>
      <p>Enter your university email to reset your password.</p>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <form id="forgotForm">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <div class="input-with-icon">
          <input type="email" id="email" placeholder="you@example.com" required autofocus>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="login-btn">
        <span>Request Password Reset</span>
      </button>

      <div class="auth-footer-stack">
        <div><a href="/login">&#8592; Return to Login</a></div>
        <div><a href="/">&#8592; Back to Home</a></div>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const alertBox = document.getElementById('alertBox');
    const emailInput = document.getElementById('email');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      try {
        const resp = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim() }),
        });
        const data = await resp.json();

        if (data.success) {
          alertBox.className = 'alert-box alert-success';
          alertBox.textContent = data.message || 'Password reset link sent to your registered address.';
          alertBox.style.display = 'block';
          form.reset();
        } else {
          alertBox.className = 'alert-box alert-danger';
          alertBox.textContent = data.error || 'Failed to request reset.';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert-box alert-danger';
        alertBox.textContent = 'Connection error. Please try again.';
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
