<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gueattend | Password Assistance</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
</head>
<body class="login-wrapper">

  <div class="login-card">
    <div class="login-header">
      <a href="/" class="auth-brand-row">
        <span class="auth-brand-icon">
          <img src="/images/logo.svg" alt="gueattend logo" class="brand-logo-img" width="28" height="28">
        </span>
        <span class="auth-brand-name">gueattend</span>
      </a>
      <div class="auth-tagline">TRACK. ALERT. STAY UPDATED.</div>
      <h1>Password Recovery</h1>
      <p>Enter your university email to reset your password.</p>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <form id="forgotForm">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <div class="input-with-icon">
          <input type="email" id="email" placeholder="you@example.com" required autofocus>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="login-btn">
        <span>Request Password Reset</span>
      </button>

      <div class="auth-footer-stack">
        <div><a href="/login">&#8592; Return to Login</a></div>
        <div><a href="/">&#8592; Back to Home</a></div>
      </div>
    </form>
  </div>

  <script type="module">
    const form = document.getElementById('forgotForm');
    const alertBox = document.getElementById('alertBox');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');

    let firebaseResetState = { isReady: false, configured: false, auth: null, sendPasswordResetEmail: null };

    async function loadFirebaseReset() {
      if (firebaseResetState.isReady) return firebaseResetState;
      const res = await fetch('/api/auth/firebase-config');
      if (res.ok) {
        const config = await res.json();
        firebaseResetState.configured = Boolean(config.configured && config.apiKey);
        if (firebaseResetState.configured) {
          const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js');
          const { getAuth, sendPasswordResetEmail } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js');
          const app = initializeApp(config);
          firebaseResetState.auth = getAuth(app);
          firebaseResetState.sendPasswordResetEmail = sendPasswordResetEmail;
          firebaseResetState.isReady = true;
        }
      }
      return firebaseResetState;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      const email = emailInput.value.trim().toLowerCase();
      if (!email) {
        alertBox.className = 'alert-box alert-danger';
        alertBox.textContent = 'Please enter your email address.';
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      try {
        const fb = await loadFirebaseReset();
        if (!fb.configured || !fb.auth || !fb.sendPasswordResetEmail) {
          alertBox.className = 'alert-box alert-danger';
          alertBox.textContent = 'Firebase Password Reset requires FIREBASE_API_KEY configured on the server.';
          alertBox.style.display = 'block';
          return;
        }

        await fb.sendPasswordResetEmail(fb.auth, email);
        alertBox.className = 'alert-box alert-success';
        alertBox.textContent = 'If an account exists for this email, Firebase has sent a password reset link to your inbox.';
        alertBox.style.display = 'block';
        form.reset();
      } catch (err) {
        const code = err?.code || '';
        if (code === 'auth/user-not-found') {
          alertBox.className = 'alert-box alert-success';
          alertBox.textContent = 'If an account exists for this email, Firebase has sent a password reset link to your inbox.';
          form.reset();
        } else {
          alertBox.className = 'alert-box alert-danger';
          alertBox.textContent = code === 'auth/invalid-email'
            ? 'Please enter a valid email address.'
            : (err?.message || 'Unable to dispatch Firebase password reset email.');
        }
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
